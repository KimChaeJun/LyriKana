<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LyriKana Settings</title>
    <script type="module" src="./popup.ts"></script>
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">LK</div>
          <div>
            <h1>LyriKana</h1>
            <p>YouTube Music overlay</p>
          </div>
        </div>
        <div class="master-toggle">
          <span>Overlay</span>
          <label class="switch" aria-label="Enable LyriKana overlay">
            <input id="enabled" type="checkbox" />
            <span></span>
          </label>
        </div>
      </header>

      <section class="settings-card">
        <div class="section-heading">
          <h2>표시 항목</h2>
          <p>오버레이에 보여줄 가사 정보를 고릅니다.</p>
        </div>
        <div class="control-group">
          <label class="check-row">
            <input id="showReading" type="checkbox" />
            <span>일본어 발음</span>
          </label>
          <label class="check-row">
            <input id="showTranslation" type="checkbox" />
            <span>한국어 가사</span>
          </label>
          <label class="check-row">
            <input id="showNextLine" type="checkbox" />
            <span>다음 가사 미리보기</span>
          </label>
          <label class="check-row">
            <input id="showInstrumental" type="checkbox" />
            <span>전주/간주 표시</span>
          </label>
        </div>
      </section>

      <section class="settings-card">
        <div class="section-heading">
          <h2>화면 스타일</h2>
          <p>카드 색상과 글씨 크기의 기준값입니다.</p>
        </div>
        <fieldset class="theme-field">
          <legend>테마</legend>
          <div class="theme-options" role="radiogroup" aria-label="Overlay theme">
            <label>
              <input type="radio" name="themeMode" value="system" />
              <span>Chrome</span>
            </label>
            <label>
              <input type="radio" name="themeMode" value="dark" />
              <span>Dark</span>
            </label>
            <label>
              <input type="radio" name="themeMode" value="light" />
              <span>White</span>
            </label>
          </div>
        </fieldset>
        <div class="control-grid">
          <label class="field-row">
            <span>원문 최소 크기</span>
            <input id="originalFontSize" type="number" min="16" max="42" />
          </label>
          <label class="field-row">
            <span>발음 최소 크기</span>
            <input id="readingFontSize" type="number" min="12" max="32" />
          </label>
          <label class="field-row">
            <span>한국어 최소 크기</span>
            <input id="translationFontSize" type="number" min="12" max="32" />
          </label>
          <label class="field-row">
            <span>하단 위치</span>
            <input id="bottomOffset" type="number" min="40" max="320" />
          </label>
        </div>
      </section>

      <section class="settings-card">
        <div class="section-heading">
          <h2>재생 타이밍</h2>
          <p>가사 카드의 투명도와 미리보기 속도입니다.</p>
        </div>
        <div class="range-group">
          <label class="range-row">
            <span>오버레이 투명도</span>
            <output id="overlayOpacityValue"></output>
            <input id="overlayOpacity" type="range" min="0.25" max="1" step="0.01" />
          </label>
          <label class="range-row">
            <span>미리보기 시간</span>
            <output id="previewLeadTimeValue"></output>
            <input id="previewLeadTime" type="range" min="-1.5" max="1.5" step="0.1" />
          </label>
        </div>
      </section>

      <footer class="popup-footer">
        <button id="reset" type="button">Reset</button>
        <span id="status" role="status"></span>
      </footer>
    </main>
  </body>
</html>
