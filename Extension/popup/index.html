<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LyriKana Settings</title>
    <script type="module" src="./popup.ts"></script>
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div>
          <h1>LyriKana</h1>
          <p>YouTube Music overlay settings</p>
        </div>
        <label class="switch">
          <input id="enabled" type="checkbox" />
          <span></span>
        </label>
      </header>

      <section class="control-group">
        <label>
          <input id="showReading" type="checkbox" />
          <span>Show reading</span>
        </label>
        <label>
          <input id="showTranslation" type="checkbox" />
          <span>Show Korean line</span>
        </label>
        <label>
          <input id="showNextLine" type="checkbox" />
          <span>Show next lyric</span>
        </label>
      </section>

      <section class="control-grid">
        <label>
          <span>Theme</span>
          <select id="themeMode">
            <option value="system">Chrome setting</option>
            <option value="dark">Dark mode</option>
            <option value="light">White mode</option>
          </select>
        </label>
        <label>
          <span>Original min size</span>
          <input id="originalFontSize" type="number" min="16" max="42" />
        </label>
        <label>
          <span>Reading min size</span>
          <input id="readingFontSize" type="number" min="12" max="32" />
        </label>
        <label>
          <span>Korean min size</span>
          <input id="translationFontSize" type="number" min="12" max="32" />
        </label>
        <label>
          <span>Bottom offset</span>
          <input id="bottomOffset" type="number" min="40" max="320" />
        </label>
      </section>

      <section class="range-group">
        <label>
          <span>Overlay opacity</span>
          <output id="overlayOpacityValue"></output>
          <input id="overlayOpacity" type="range" min="0.25" max="1" step="0.01" />
        </label>
        <label>
          <span>Preview lead time</span>
          <output id="previewLeadTimeValue"></output>
          <input id="previewLeadTime" type="range" min="0" max="1.5" step="0.1" />
        </label>
      </section>

      <footer>
        <button id="reset" type="button">Reset</button>
        <span id="status" role="status"></span>
      </footer>
    </main>
  </body>
</html>
